<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B7D4E">
  <meta name="description" content="Muslim Pedia - Al-Quran Online dengan Terjemahan Indonesia">
  <title>Muslim Pedia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Home Page -->
    <section id="home-page" class="page active">
      <div class="header">
        <div class="header-pattern"></div>
        <div class="header-content">
          <h1 class="app-title"><i class="fas fa-book-quran"></i> Muslim Pedia</h1>
          <p class="app-subtitle">Al-Quran Digital dengan Terjemahan</p>
        </div>
      </div>
      <div class="page-content">
        <div id="last-read-container"></div>
        <div class="section-title">
          <h2>Daftar Surah</h2>
          <span class="surah-count">114 Surah</span>
        </div>
        <div id="surah-list" class="surah-list"></div>
      </div>
    </section>

    <!-- Surah Detail Page -->
    <section id="surah-detail-page" class="page">
      <div class="detail-header">
        <button class="back-btn" id="back-btn"><i class="fas fa-arrow-left"></i></button>
        <div class="detail-header-info">
          <h2 id="detail-surah-name"></h2>
          <p id="detail-surah-info"></p>
        </div>
        <div id="detail-surah-arabic" class="detail-arabic-name"></div>
      </div>
      <div class="page-content">
        <div id="surah-bismillah" class="bismillah"></div>
        <div id="ayah-list" class="ayah-list"></div>
        <div class="surah-navigation" id="surah-navigation"></div>
      </div>
    </section>

    <!-- Search Page -->
    <section id="search-page" class="page">
      <div class="search-header">
        <h2>Pencarian</h2>
        <div class="search-input-wrapper">
          <i class="fas fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input" placeholder="Cari surah atau ayat..." autocomplete="off">
          <button id="clear-search" class="clear-search-btn" style="display:none;"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="search-tabs">
          <button class="search-tab active" data-tab="surah">Surah</button>
          <button class="search-tab" data-tab="ayah">Ayat</button>
        </div>
      </div>
      <div class="page-content">
        <div id="search-results" class="search-results"></div>
      </div>
    </section>

    <!-- Bookmark Page -->
    <section id="bookmark-page" class="page">
      <div class="simple-header">
        <h2>Bookmark</h2>
      </div>
      <div class="page-content">
        <div id="bookmark-list" class="bookmark-list"></div>
      </div>
    </section>

    <!-- Settings Page -->
    <section id="settings-page" class="page">
      <div class="simple-header">
        <h2>Pengaturan</h2>
      </div>
      <div class="page-content">
        <div class="settings-group">
          <div class="settings-item">
            <div class="settings-label">
              <i class="fas fa-text-height"></i>
              <span>Ukuran Teks Arab</span>
            </div>
            <div class="settings-control">
              <span id="font-size-value">28px</span>
              <input type="range" id="font-size-slider" min="18" max="40" value="28">
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-label">
              <i class="fas fa-moon"></i>
              <span>Mode Gelap</span>
            </div>
            <div class="settings-control">
              <label class="toggle-switch">
                <input type="checkbox" id="dark-mode-toggle">
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-label">
              <i class="fas fa-headphones"></i>
              <span>Qari</span>
            </div>
            <div class="settings-control full-width">
              <select id="reciter-select">
                <option value="01">Abdullah Al-Juhany</option>
                <option value="02">Abdul Muhsin Al-Qasim</option>
                <option value="03">Abdurrahman as-Sudais</option>
                <option value="04">Ibrahim Al-Dossari</option>
                <option value="05" selected>Misyari Rasyid Al-Afasi</option>
                <option value="06">Yasser Al-Dosari</option>
              </select>
            </div>
          </div>
        </div>
        <div class="settings-group">
          <h3 class="settings-group-title">Tentang</h3>
          <div class="settings-item">
            <div class="settings-label">
              <i class="fas fa-info-circle"></i>
              <span>Muslim Pedia v1.0</span>
            </div>
          </div>
          <div class="settings-item">
            <div class="settings-label">
              <i class="fas fa-database"></i>
              <span>Data dari equran.id</span>
            </div>
          </div>
        </div>
        <div class="arabic-preview settings-group">
          <h3 class="settings-group-title">Pratinjau Teks Arab</h3>
          <p class="preview-arabic" id="preview-arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
        </div>
      </div>
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home">
        <i class="fas fa-house"></i>
        <span>Home</span>
      </button>
      <button class="nav-item" data-page="search">
        <i class="fas fa-magnifying-glass"></i>
        <span>Cari</span>
      </button>
      <button class="nav-item" data-page="bookmark">
        <i class="fas fa-bookmark"></i>
        <span>Bookmark</span>
      </button>
      <button class="nav-item" data-page="settings">
        <i class="fas fa-gear"></i>
        <span>Setelan</span>
      </button>
    </nav>
  </div>

  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
